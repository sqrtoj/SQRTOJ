<div class="blog-sidebox sidebox">
    <h3 class="sidebox-head">
        <span><i class="fa fa-trophy" aria-hidden="true"></i> {{ _('Top users') }}</span>
    </h3>
    <div class="sidebox-content leaderboard-content">
        <ol class="leaderboard-podium">
            {% for user in top_rated_users %}
                <li class="podium-row podium-row--{{ loop.index }}">
                    <span class="podium-rank">
                        {%- if loop.index <= 3 -%}
                            <i class="fa fa-trophy" aria-hidden="true"></i>
                        {%- else -%}
                            {{ loop.index }}
                        {%- endif -%}
                    </span>
                    <img class="podium-avatar" src="{{ gravatar(user, 40) }}" loading="lazy" alt="">
                    <span class="podium-name">{{ link_user(user) }}</span>
                    {% if user.rating is not none %}
                        <span class="podium-value {{ rating_class(user.rating) }}">{{ user.rating }}</span>
                    {% endif %}
                </li>
            {% endfor %}
        </ol>
        <div class="leaderboard-footer">
            <a class="leaderboard-footer-left" href="{{ url('organization_list') }}">{{ _('Organizations') }}</a>
            <a class="leaderboard-footer-right" href="{{ url('user_list') }}">{{ _('View all') }} &raquo;</a>
        </div>
    </div>
</div>
