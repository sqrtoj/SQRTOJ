<style id="sqrtoj-contest-widget-css">
/* SQRTOJ quick-submit widget
 * Keep this component self-contained so it can also run in the PiP document.
 */
#sqrtoj-contest-widget,
#sqrtoj-contest-widget * {
  box-sizing: border-box;
}

#sqrtoj-contest-widget {
  --cw-page: #16120f;
  --cw-panel: #211a16;
  --cw-surface: #2b211b;
  --cw-surface-hover: #35281f;
  --cw-border: rgba(255, 226, 204, 0.15);
  --cw-border-strong: rgba(255, 181, 112, 0.4);
  --cw-text: #fff8f1;
  --cw-muted: #b9a99e;
  --cw-accent: #f39a55;
  --cw-accent-strong: #e87832;
  --cw-accent-soft: rgba(243, 154, 85, 0.14);
  --cw-success: #58bf7d;
  --cw-danger: #e7796e;
  --cw-radius: 16px;
  position: fixed;
  right: 18px;
  bottom: 18px;
  z-index: 199900;
  color: var(--cw-text);
  font-family: inherit;
  font-size: 13px;
}

#sqrtoj-contest-widget[hidden],
#sqrtoj-contest-widget [hidden] {
  display: none !important;
}

#sqrtoj-contest-widget button,
#sqrtoj-contest-widget input,
#sqrtoj-contest-widget select,
#sqrtoj-contest-widget textarea {
  font: inherit;
}

.sqrtoj-cw-launcher {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  min-height: 42px;
  padding: 0 14px;
  border: 1px solid var(--cw-border);
  border-radius: 999px;
  background: var(--cw-panel);
  color: var(--cw-text);
  box-shadow: 0 8px 24px rgba(18, 10, 5, 0.26);
  cursor: pointer;
  font-weight: 800;
  transition: border-color 160ms ease, background 160ms ease, transform 160ms ease;
}

.sqrtoj-cw-launcher:hover {
  border-color: var(--cw-border-strong);
  background: var(--cw-surface-hover);
  transform: translateY(-1px);
}

.sqrtoj-cw-launcher i,
.sqrtoj-cw-title > i {
  color: var(--cw-accent);
}

.sqrtoj-cw-panel {
  display: flex;
  flex-direction: column;
  width: min(392px, calc(100vw - 24px));
  height: min(560px, calc(100dvh - 24px));
  overflow: hidden;
  border: 1px solid var(--cw-border);
  border-radius: var(--cw-radius);
  background: var(--cw-panel);
  box-shadow: 0 18px 48px rgba(18, 10, 5, 0.38);
}

.sqrtoj-cw-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  min-height: 66px;
  padding: 12px 14px;
  border-bottom: 1px solid var(--cw-border);
  background: var(--cw-panel);
}

.sqrtoj-cw-title {
  display: flex;
  align-items: center;
  min-width: 0;
  gap: 10px;
}

.sqrtoj-cw-title > i {
  display: grid;
  flex: 0 0 32px;
  place-items: center;
  width: 32px;
  height: 32px;
  border: 1px solid var(--cw-border);
  border-radius: 10px;
  background: var(--cw-accent-soft);
}

.sqrtoj-cw-title strong {
  display: block;
  overflow: hidden;
  color: var(--cw-text);
  font-size: 13px;
  font-weight: 800;
  line-height: 1.25;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.sqrtoj-cw-subtitle {
  display: block;
  margin-top: 3px;
  color: var(--cw-muted);
  font-size: 10px;
  line-height: 1.2;
}

.sqrtoj-cw-live {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  margin-left: 6px;
  color: var(--cw-success);
  font-size: 9px;
  font-weight: 900;
  letter-spacing: 0.08em;
  vertical-align: middle;
}

.sqrtoj-cw-live i {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--cw-success);
}

.sqrtoj-cw-head-actions,
.sqrtoj-cw-tabs {
  display: flex;
  align-items: center;
}

.sqrtoj-cw-head-actions {
  gap: 6px;
}

.sqrtoj-cw-icon-btn,
.sqrtoj-cw-refresh {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border: 1px solid var(--cw-border);
  background: var(--cw-surface);
  color: var(--cw-text);
  cursor: pointer;
  transition: border-color 160ms ease, background 160ms ease, color 160ms ease;
}

.sqrtoj-cw-icon-btn {
  width: 32px;
  height: 32px;
  border-radius: 9px;
}

.sqrtoj-cw-icon-btn:hover,
.sqrtoj-cw-refresh:hover {
  border-color: var(--cw-border-strong);
  background: var(--cw-surface-hover);
  color: var(--cw-accent);
}

.sqrtoj-cw-toggle {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  min-height: 32px;
  padding: 4px 7px;
  border: 1px solid var(--cw-border);
  border-radius: 999px;
  background: var(--cw-surface);
  color: var(--cw-muted);
  cursor: pointer;
  user-select: none;
}

.sqrtoj-cw-toggle input {
  position: absolute;
  width: 1px;
  height: 1px;
  opacity: 0;
  pointer-events: none;
}

.sqrtoj-cw-switch {
  position: relative;
  display: inline-block;
  width: 30px;
  height: 18px;
  border-radius: 999px;
  background: #5d4436;
  transition: background 160ms ease;
}

.sqrtoj-cw-switch i {
  position: absolute;
  top: 3px;
  left: 3px;
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: #fff8f1;
  box-shadow: 0 1px 4px rgba(0, 0, 0, 0.28);
  transition: left 160ms ease;
}

.sqrtoj-cw-toggle input:checked + .sqrtoj-cw-switch {
  background: var(--cw-accent-strong);
}

.sqrtoj-cw-toggle input:checked + .sqrtoj-cw-switch i {
  left: 15px;
}

.sqrtoj-cw-toggle input:focus-visible + .sqrtoj-cw-switch {
  outline: 2px solid var(--cw-accent);
  outline-offset: 2px;
}

.sqrtoj-cw-toggle-label {
  min-width: 24px;
  font-size: 10px;
  font-weight: 800;
  text-align: center;
}

.sqrtoj-cw-tabs {
  gap: 4px;
  padding: 7px 9px;
  border-bottom: 1px solid var(--cw-border);
  background: var(--cw-surface);
}

.sqrtoj-cw-tab {
  display: inline-flex;
  flex: 1;
  align-items: center;
  justify-content: center;
  gap: 6px;
  min-height: 34px;
  padding: 0 8px;
  border: 0;
  border-radius: 9px;
  background: transparent;
  color: var(--cw-muted);
  cursor: pointer;
  font-size: 11px;
  font-weight: 800;
  transition: background 160ms ease, color 160ms ease;
}

.sqrtoj-cw-tab:hover {
  color: var(--cw-text);
}

.sqrtoj-cw-tab.is-active {
  background: var(--cw-accent-soft);
  color: var(--cw-accent);
}

.sqrtoj-cw-tab-count {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 19px;
  height: 19px;
  padding: 0 5px;
  border-radius: 999px;
  background: rgba(243, 154, 85, 0.16);
  color: var(--cw-accent);
  font-size: 9px;
}

.sqrtoj-cw-body {
  flex: 1 1 0;
  min-height: 0;
  overflow: auto;
  padding: 12px;
  scrollbar-color: var(--cw-border-strong) transparent;
  scrollbar-width: thin;
}

.sqrtoj-cw-toolbar {
  display: flex;
  align-items: center;
  gap: 7px;
  margin-bottom: 9px;
}

.sqrtoj-cw-toolbar > span {
  color: var(--cw-text);
  font-size: 12px;
  font-weight: 800;
}

.sqrtoj-cw-search {
  flex: 1;
  min-width: 0;
  min-height: 36px;
  padding: 0 11px;
  border: 1px solid var(--cw-border);
  border-radius: 9px;
  outline: none;
  background: var(--cw-surface);
  color: var(--cw-text);
  font-size: 11px;
}

.sqrtoj-cw-search::placeholder {
  color: var(--cw-muted);
}

.sqrtoj-cw-search:focus {
  border-color: var(--cw-border-strong);
}

.sqrtoj-cw-refresh {
  width: 36px;
  height: 36px;
  border-radius: 9px;
  color: var(--cw-accent);
}

.sqrtoj-cw-list {
  display: grid;
  gap: 7px;
}

.sqrtoj-cw-problem,
.sqrtoj-cw-submission {
  display: flex;
  align-items: center;
  width: 100%;
  gap: 9px;
  padding: 9px;
  border: 1px solid var(--cw-border);
  border-radius: 11px;
  background: var(--cw-surface);
  color: var(--cw-text);
  text-align: left;
  cursor: pointer;
  text-decoration: none;
  transition: border-color 160ms ease, background 160ms ease, transform 160ms ease;
}

.sqrtoj-cw-problem:hover,
.sqrtoj-cw-submission:hover {
  border-color: var(--cw-border-strong);
  background: var(--cw-surface-hover);
  transform: translateY(-1px);
}

.sqrtoj-cw-problem:focus-visible,
.sqrtoj-cw-submission:focus-visible,
.sqrtoj-cw-submit:focus-visible,
.sqrtoj-cw-back:focus-visible,
.sqrtoj-cw-icon-btn:focus-visible,
.sqrtoj-cw-refresh:focus-visible,
.sqrtoj-cw-tab:focus-visible {
  outline: 2px solid var(--cw-accent);
  outline-offset: 2px;
}

.sqrtoj-cw-letter {
  display: inline-flex;
  flex: 0 0 30px;
  align-items: center;
  justify-content: center;
  width: 30px;
  height: 30px;
  border-radius: 8px;
  background: var(--cw-accent-soft);
  color: var(--cw-accent);
  font-size: 11px;
  font-weight: 900;
}

.sqrtoj-cw-problem-copy,
.sqrtoj-cw-sub-copy {
  min-width: 0;
}

.sqrtoj-cw-problem-name,
.sqrtoj-cw-sub-name {
  display: block;
  overflow: hidden;
  color: var(--cw-text);
  font-size: 11px;
  font-weight: 800;
  line-height: 1.3;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.sqrtoj-cw-problem-meta,
.sqrtoj-cw-sub-meta {
  display: block;
  overflow: hidden;
  margin-top: 2px;
  color: var(--cw-muted);
  font-size: 9px;
  line-height: 1.25;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.sqrtoj-cw-problem::after,
.sqrtoj-cw-submission::after {
  margin-left: auto;
  color: var(--cw-muted);
  content: '›';
  font-size: 18px;
  line-height: 1;
}

.sqrtoj-cw-verdict {
  display: inline-flex;
  flex: 0 0 44px;
  align-items: center;
  justify-content: center;
  min-height: 25px;
  padding: 0 4px;
  border-radius: 7px;
  background: #655f5a;
  color: #fff;
  font-size: 9px;
  font-weight: 900;
}

.sqrtoj-cw-verdict.ac {
  background: #287b4a;
}

.sqrtoj-cw-verdict.wa {
  background: #a94b46;
}

.sqrtoj-cw-verdict.queued {
  background: #89702d;
}

.sqrtoj-cw-form-view {
  display: flex;
  flex-direction: column;
  min-height: 100%;
  gap: 10px;
}

.sqrtoj-cw-back {
  align-self: flex-start;
  padding: 0;
  border: 0;
  background: transparent;
  color: var(--cw-accent);
  cursor: pointer;
  font-size: 11px;
  font-weight: 800;
}

.sqrtoj-cw-form-view form {
  display: flex;
  flex-direction: column;
  min-height: 0;
  gap: 9px;
}

.sqrtoj-cw-form-view #editor {
  display: block !important;
}

.sqrtoj-cw-form-view #editor > div:first-child {
  margin-bottom: 5px;
  color: var(--cw-muted);
  font-size: 10px;
}

.sqrtoj-cw-form-view #id_source {
  display: block !important;
  width: 100%;
  height: 210px;
  min-height: 130px;
  resize: vertical;
  padding: 10px;
  border: 1px solid var(--cw-border);
  border-radius: 10px;
  outline: none;
  background: var(--cw-page);
  color: var(--cw-text);
  font: 11px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}

.sqrtoj-cw-form-view #id_source:focus {
  border-color: var(--cw-border-strong);
}

.sqrtoj-cw-form-view #file-submit,
.sqrtoj-cw-form-view .submit-bar input[type='submit'] {
  display: none !important;
}

.sqrtoj-cw-form-view #language,
.sqrtoj-cw-form-view .submit-bar {
  display: flex;
  flex-direction: column;
  gap: 5px;
  padding: 9px;
  border: 1px solid var(--cw-border);
  border-radius: 10px;
  background: var(--cw-surface);
  color: var(--cw-text);
}

.sqrtoj-cw-form-view select {
  width: 100%;
  min-height: 34px;
  padding: 0 8px;
  border: 1px solid var(--cw-border);
  border-radius: 8px;
  outline: none;
  background: var(--cw-panel);
  color: var(--cw-text);
  font-size: 11px;
}

.sqrtoj-cw-submit {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 100%;
  min-height: 40px;
  gap: 8px;
  padding: 0 14px;
  border: 0;
  border-radius: 10px;
  background: var(--cw-accent-strong);
  color: #fff;
  cursor: pointer;
  font-size: 12px;
  font-weight: 900;
  transition: background 160ms ease, transform 160ms ease;
}

.sqrtoj-cw-submit:hover {
  background: #d96627;
  transform: translateY(-1px);
}

.sqrtoj-cw-submit:disabled {
  cursor: wait;
  opacity: 0.65;
  transform: none;
}

.sqrtoj-cw-loading,
.sqrtoj-cw-error {
  display: grid;
  min-height: 150px;
  place-items: center;
  padding: 18px;
  color: var(--cw-muted);
  text-align: center;
  font-size: 11px;
}

.sqrtoj-cw-error {
  min-height: 80px;
  border: 1px solid rgba(231, 121, 110, 0.25);
  border-radius: 10px;
  background: rgba(231, 121, 110, 0.08);
  color: var(--cw-danger);
}

.sqrtoj-cw-toast {
  margin-top: 8px;
  padding: 9px 10px;
  border: 1px solid rgba(88, 191, 125, 0.25);
  border-radius: 9px;
  background: rgba(88, 191, 125, 0.1);
  color: #9be4b2;
  font-size: 10px;
  font-weight: 700;
}

@media (prefers-color-scheme: light) {
  #sqrtoj-contest-widget {
    --cw-page: #f7f2ed;
    --cw-panel: #fffdfb;
    --cw-surface: #f5eee8;
    --cw-surface-hover: #eee3d9;
    --cw-border: rgba(105, 72, 48, 0.16);
    --cw-border-strong: rgba(191, 102, 43, 0.45);
    --cw-text: #32251d;
    --cw-muted: #7f6c5d;
    --cw-accent: #b8581f;
    --cw-accent-strong: #c96528;
    --cw-accent-soft: rgba(201, 101, 40, 0.12);
  }

  .sqrtoj-cw-launcher,
  .sqrtoj-cw-panel {
    box-shadow: 0 14px 36px rgba(92, 57, 31, 0.16);
  }

  .sqrtoj-cw-verdict {
    color: #fff;
  }
}

/* The PiP document is deliberately opaque and dark so the original page cannot bleed through. */
html.sqrtoj-cw-popup,
html.sqrtoj-cw-popup body {
  min-width: 0 !important;
  min-height: 100% !important;
  margin: 0 !important;
  overflow: hidden !important;
  background: var(--cw-page, #16120f) !important;
  color: var(--cw-text, #fff8f1) !important;
}

html.sqrtoj-cw-popup #sqrtoj-contest-widget {
  --cw-page: #16120f;
  --cw-panel: #211a16;
  --cw-surface: #2b211b;
  --cw-surface-hover: #35281f;
  --cw-border: rgba(255, 226, 204, 0.15);
  --cw-border-strong: rgba(255, 181, 112, 0.4);
  --cw-text: #fff8f1;
  --cw-muted: #b9a99e;
  --cw-accent: #f39a55;
  --cw-accent-strong: #e87832;
  display: flex !important;
  position: fixed !important;
  inset: 0 !important;
  align-items: center !important;
  justify-content: center !important;
  width: 100vw !important;
  height: 100dvh !important;
  padding: 12px !important;
  background: var(--cw-page) !important;
}

html.sqrtoj-cw-popup body > *:not(#sqrtoj-contest-widget),
html.sqrtoj-cw-popup body > #page-container {
  display: none !important;
}

html.sqrtoj-cw-popup #sqrtoj-contest-widget .sqrtoj-cw-panel {
  display: flex !important;
  width: min(392px, calc(100vw - 24px)) !important;
  height: min(560px, calc(100dvh - 24px)) !important;
  max-height: calc(100dvh - 24px) !important;
}

@media (max-width: 560px) {
  #sqrtoj-contest-widget {
    right: 10px;
    bottom: 10px;
  }

  .sqrtoj-cw-panel {
    width: calc(100vw - 20px);
    height: calc(100dvh - 20px);
    border-radius: 14px;
  }

  .sqrtoj-cw-head {
    padding: 10px 11px;
  }

  .sqrtoj-cw-body {
    padding: 10px;
  }
}

@media (prefers-reduced-motion: reduce) {
  #sqrtoj-contest-widget *,
  #sqrtoj-contest-widget *::before,
  #sqrtoj-contest-widget *::after {
    transition: none !important;
  }
}
</style>
