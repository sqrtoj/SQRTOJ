{% extends "base.html" %}

{% block title_row %}{% endblock %}
{% block title_ruler %}{% endblock %}

{% block body %}
    <div class="auth-page">
        <div class="auth-card">
            <div class="auth-brand">
                <img src="{{ static('icons/logo.svg') }}" alt="{{ SITE_NAME }}" width="72" height="72"
                     onerror="this.src='{{ static('icons/logo.png') }}'; this.onerror=null">
                <h1 class="auth-title">{{ _('Reset your password') }}</h1>
                <p class="auth-subtitle">{{ _('Enter your email and we will send you a reset link.') }}</p>
            </div>
            <form action="" method="post" class="auth-form">
                {% csrf_token %}
                <table border="0" class="auth-astable">{{ form.as_table() }}</table>
                <button class="auth-submit full" type="submit">{{ _('Send Reset Email') }}</button>
            </form>
        </div>
    </div>
{% endblock %}
