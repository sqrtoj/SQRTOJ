{% extends "flatpages/markdown.html" %}

{% block body %}
    <div class="content-description">
        {% cache 86400 'flatpage' flatpage.url %}
            {{ flatpage.content|markdown('flatpage', MATH_ENGINE)|reference }}
        {% endcache %}
    </div>
{% endblock %}

{% block bodyend %}
    {% if REQUIRE_JAX %}{% include "mathjax-load.html" %}{% endif %}
{% endblock %}
