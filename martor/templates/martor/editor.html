{% load i18n %}
<div class="main-martor main-martor-{{ field_name }}" data-field-name="{{ field_name }}">
  <div class="section-martor">
    <div class="ui top attached tabular pointing secondary menu tab-martor-menu" role="tablist">
      <a class="item active" data-tab="editor-tab-{{ field_name }}" role="tab" aria-selected="true" aria-controls="editor-tab-panel-{{ field_name }}">
        <i class="edit icon" aria-hidden="true"></i> {% trans "Editor" %}
      </a>
      <a class="item" data-tab="preview-tab-{{ field_name }}" role="tab" aria-selected="false" aria-controls="preview-tab-panel-{{ field_name }}">
        <i class="eye icon" aria-hidden="true"></i> {% trans "Preview" %}
      </a>
      {% include "martor/toolbar.html" %}
    </div>
    <div id="editor-tab-panel-{{ field_name }}" class="ui bottom attached tab segment active" data-tab="editor-tab-{{ field_name }}" role="tabpanel">
      <div class="ui dimmer upload-progress" data-field-name="{{ field_name }}" hidden style="display: none;">
        <div class="ui text loader">{% trans "Uploading... please wait..." %}</div>
      </div>
      <div id="martor-{{ field_name }}" class="martor-field martor-field-{{ field_name }}"></div>
      {{ martor }}
      <i class="angle double down grey icon expand-editor" role="button" tabindex="0" title="{% trans 'Expand editor' %}" aria-label="{% trans 'Expand editor' %}"></i>
    </div>
    <div id="preview-tab-panel-{{ field_name }}" class="ui bottom attached tab segment martor-preview" data-tab="preview-tab-{{ field_name }}" role="tabpanel">
      <p>{% trans "Nothing to preview" %}</p>
    </div>
  </div>

  {% include 'martor/guide.html' %}
</div>
